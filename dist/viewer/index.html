<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiln · Your assets</title><link rel="stylesheet" href="/style.css"></head>
<body><header><a class="brand" href="/">K<span>ILN</span><small>ASSET LIBRARY</small></a><div class="header-actions"><span class="local">LOCAL · YOUR FILES</span><label class="button secondary">Open GLB or bundle<input id="open" type="file" accept=".glb,.zip" multiple hidden></label></div></header>
<main><aside><div class="section-label">YOUR COLLECTIONS</div><nav id="collections" aria-label="Collections"></nav><div class="aside-note">Saved assets stay with their source.<br>Open any revision. Keep building.</div></aside>
<section class="library"><div class="heading"><div><div class="eyebrow">MADE WITH KILN</div><h1 id="collection-title">Your assets</h1><p id="collection-caption">A place for what you’re building.</p></div><button id="refresh" class="secondary">Refresh</button></div>
<div class="toolbar"><input id="search" type="search" placeholder="Find an asset or tag…" aria-label="Search assets"><span id="count"></span><button id="export-selection" class="secondary" disabled>Export selected</button></div>
<div id="status" role="status" aria-live="polite"></div><div id="cards" class="cards"></div></section></main>
<dialog id="detail" aria-labelledby="asset-name"><div class="detail-top"><div><span class="eyebrow">ASSET / REVISION</span><h2 id="asset-name"></h2></div><button id="close-detail" class="secondary">Close</button></div>
<div class="detail-layout"><div class="stage-wrap"><div id="stage"></div><p id="stage-status" role="status"></p><div class="stage-controls"><button id="frame">Reset view</button><button id="wire" aria-pressed="false">Wireframe</button><select id="lighting" aria-label="Lighting"><option value="studio">Studio</option><option value="soft">Soft</option><option value="bright">Bright</option></select><select id="animation" aria-label="Animation"><option value="">Rest pose</option></select><button id="play" disabled>Pause</button></div><p class="gesture">Drag to orbit · Scroll to zoom · Right-drag to pan</p></div>
<section class="details"><label class="field">Revision<select id="revisions"></select></label><div id="asset-stats" class="stats"></div><p id="asset-description"></p><div id="downloads" class="downloads"></div><button id="refine" class="secondary">Copy refinement instructions</button><details><summary>Source & build record</summary><pre id="provenance"></pre></details></section></div></dialog>
<script type="module" src="/app.js"></script></body></html>
