name: Gallery

# The gallery is built, not published from a folder of exported meshes: every GLB
# it serves comes out of running `examples/*.kiln.js` through the engine on the
# runner. That is the point of it -- a program and the model the page shows cannot
# drift apart -- and it also means a program that stops building fails here.
on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'site/**'
      - 'src/**'
      - 'scripts/authorship.ts'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/**'
      - 'site/**'
      - 'src/**'
      - 'scripts/authorship.ts'
      - 'README.md'
      - '.github/workflows/pages.yml'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  KILN_RENDER: cpu

jobs:
  build:
    name: build the gallery
    # Was pinned to windows-2022 because poster receipts asserted exact GLB bytes
    # captured there, and platform float math genuinely does change them --
    # measured, and in both the JSON and BIN chunks, so no canonical form fixes
    # it (ledger 6.1). What changed is that a receipt no longer claims it: it
    # asserts the source and the image, which are platform-stable, and records
    # the artifact hash as provenance rather than as an assertion (6.2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install the engine
        run: bun install --frozen-lockfile

      # Before the build, deliberately: the gallery images live in R2 now, and
      # whether they are still served and still byte-identical to their receipts
      # has nothing to do with whether the GLBs rebuild. Running it first means a
      # broken bucket reports as a broken bucket rather than hiding behind a
      # build failure.
      - name: Verify the published gallery images
        run: bun scripts/verify-posters.mjs

      - name: Install the site
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Typecheck the site
        run: bunx tsc --noEmit
        working-directory: site

      # Not closing a gap: `bun run test` is `bun test src scripts`, and bun treats
      # those as SUBSTRING filters on paths, so `site/scripts` already matched and
      # CI already ran these. Kept because that coverage is incidental -- spelling
      # the script `bun test ./src ./scripts` would silently drop it -- and because
      # these are the only automated check on what a poster receipt asserts.
      - name: Test the site scripts
        run: bun test scripts
        working-directory: site

      # Fifty programs through the evaluator, writing GLBs, thumbnails and the
      # index the page reads. Roughly a minute of CPU.
      - name: Build the assets
        run: bun scripts/build-assets.mjs
        working-directory: site

      # Derived from `skills/`, and published with a sha256 per artifact, so it has
      # to be generated in the same run that serves it rather than committed.
      - name: Build the well-known skills index
        run: bun scripts/build-skills-discovery.mjs
        working-directory: site

      - name: Build the site
        run: bunx vite build
        working-directory: site

      - name: Verify source, downloads and poster records
        run: bun scripts/verify-assets.mjs
        working-directory: site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      # `include-hidden-files` is required, not optional. v5 of this action archives
      # with `--exclude=.[^/]*` unless it is set, which silently strips EVERY
      # hidden path. The well-known skills index is at `.well-known/`, so the first
      # deployment built it correctly, vite copied it correctly, and the upload
      # deleted it: 465 entries in the artifact and not one of them a dotfile,
      # while the same build locally produced all seven. Nothing reproducible on a
      # workstation would have found this, because the exclusion is in the action
      # rather than in the build.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist
          include-hidden-files: true

  deploy:
    name: deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
