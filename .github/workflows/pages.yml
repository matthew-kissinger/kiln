name: Gallery

# The gallery is built, not published from a folder of exported meshes: every GLB
# it serves comes out of running `examples/*.kiln.js` through the engine on the
# runner. That is the point of it -- a program and the model the page shows cannot
# drift apart -- and it also means a program that stops building fails here.
on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'site/**'
      - 'src/**'
      - 'scripts/authorship.ts'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/**'
      - 'site/**'
      - 'src/**'
      - 'scripts/authorship.ts'
      - 'README.md'
      - '.github/workflows/pages.yml'

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  KILN_RENDER: cpu

jobs:
  build:
    name: build the gallery
    # Poster receipts bind exact GLB bytes captured on Windows. Platform math
    # can change the last digit of serialized rotations without changing meshes.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install the engine
        run: bun install --frozen-lockfile

      - name: Install the site
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Typecheck the site
        run: bunx tsc --noEmit
        working-directory: site

      # Fifty programs through the evaluator, writing GLBs, thumbnails and the
      # index the page reads. Roughly a minute of CPU.
      - name: Build the assets
        run: bun scripts/build-assets.mjs
        working-directory: site

      - name: Build the site
        run: bunx vite build
        working-directory: site

      - name: Verify source, downloads and poster records
        run: bun scripts/verify-assets.mjs
        working-directory: site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    name: deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
