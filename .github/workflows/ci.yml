name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Views must be byte-reproducible in CI: never let a runner that happens to have
  # a GPU render service reachable change what the golden-image tests compare.
  KILN_RENDER: cpu

jobs:
  checks:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Setup npm
        run: npm install --global npm@12.0.1

      - name: Check toolchain metadata
        run: bun run check:toolchain

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint

      # KILN_SPIKE_LIVE=0 (the `test:coverage` script default) keeps tests offline — no model
      # calls, no provider key. `test:live` is the opt-in live path, not run in CI.
      # bunfig.toml reports text + LCOV and enforces the checked-in coverage ratchet.
      - name: Unit tests and coverage gate
        run: bun run test:coverage

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  package-candidate:
    name: build portable Node package
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
      - run: npm install --global npm@12.0.1
      - run: bun install --frozen-lockfile
      - run: bun run build:runtime
      - name: Pack without publishing
        run: |
          mkdir candidate
          npm pack --ignore-scripts --pack-destination candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-package-candidate
          path: candidate/*.tgz
          if-no-files-found: error
          retention-days: 14

  macos-package:
    name: Node package · macOS ${{ matrix.arch }}
    needs: package-candidate
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Consumers install only Node/npm. Bun builds the tarball in the separate producer job.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          architecture: ${{ matrix.arch }}
      - run: npm install --global npm@12.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-package-candidate
          path: candidate
      - name: Verify native host
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.platform!=='darwin'||process.arch!==process.env.EXPECTED_ARCH)process.exit(1);console.log(process.platform,process.arch,process.version)"
      - name: Install and exercise the end-user distribution
        shell: bash
        run: |
          set -euo pipefail
          set -- "$PWD"/candidate/*.tgz
          test "$#" -eq 1
          npm run --silent test:package -- --tarball "$1" | tee package-smoke.json
      - name: Verify the retained smoke receipt
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: >-
          node -e "const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto');const r=JSON.parse(fs.readFileSync('package-smoke.json','utf8'));assert.equal(r.status,'passed');assert.equal(r.platform,'darwin');assert.equal(r.arch,process.env.EXPECTED_ARCH);assert.equal(r.node,'v22.23.1');assert.equal(r.npm,'12.0.1');assert.equal(r.tarballSha256,crypto.createHash('sha256').update(fs.readFileSync(r.tarball)).digest('hex'));for(const check of ['packaged-node-worker','source-reference-edit-images','server-restart-persistence','exact-source-export'])assert(r.checks.includes(check));"
      - name: Retain macOS package receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-package-${{ matrix.arch }}
          path: package-smoke.json
          if-no-files-found: warn
          retention-days: 14
