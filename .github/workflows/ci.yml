name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Views must be byte-reproducible in CI: never let a runner that happens to have
  # a GPU render service reachable change what the golden-image tests compare.
  KILN_RENDER: cpu

jobs:
  checks:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1

      - name: Setup npm
        run: npm install --global npm@12.0.1

      - name: Check toolchain metadata
        run: bun run check:toolchain

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (Biome)
        run: bun run lint

      # KILN_SPIKE_LIVE=0 (the `test:coverage` script default) keeps tests offline — no model
      # calls, no provider key. `test:live` is the opt-in live path, not run in CI.
      # bunfig.toml reports text + LCOV and enforces the checked-in coverage ratchet.
      - name: Unit tests and coverage gate
        run: bun run test:coverage

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14
